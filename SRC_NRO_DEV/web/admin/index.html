<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - SRC NRO</title>
    <link rel="stylesheet" href="/admin/styles.css" />
    <!-- Thứ tự load: config → state → api → loader → table → modal → crud → ui → main -->
    <script src="/admin/js/config.js" defer></script>
    <script src="/admin/js/state.js"  defer></script>
    <script src="/admin/js/api.js"    defer></script>
    <script src="/admin/js/loader.js" defer></script>
    <script src="/admin/js/table.js"  defer></script>
    <script src="/admin/js/modal.js"  defer></script>
    <script src="/admin/js/crud.js"   defer></script>
    <script src="/admin/js/ui.js"     defer></script>
    <script src="/admin/js/main.js"   defer></script>
</head>

<body>
    <div class="app-shell">

        <!-- ── Sidebar ── -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-mark">S</div>
                <div>
                    <h1>SRC NRO</h1>
                    <small>Admin Panel</small>
                </div>
            </div>

            <nav class="menu">
                <button class="menu-item active" data-target="dashboard">
                    <span class="menu-icon">📊</span>
                    <span class="menu-label">Dashboard</span>
                </button>
                <button class="menu-item" data-target="accounts">
                    <span class="menu-icon">👤</span>
                    <span class="menu-label">Tài khoản</span>
                </button>
                <button class="menu-item" data-target="players">
                    <span class="menu-icon">⚔️</span>
                    <span class="menu-label">Nhân vật</span>
                </button>
                <button class="menu-item" data-target="giftcodes">
                    <span class="menu-icon">🎁</span>
                    <span class="menu-label">Gift code</span>
                </button>
                <button class="menu-item" data-target="items">
                    <span class="menu-icon">🎒</span>
                    <span class="menu-label">Vật phẩm</span>
                </button>
                <button class="menu-item" data-target="shops">
                    <span class="menu-icon">🏪</span>
                    <span class="menu-label">Shop vật phẩm</span>
                </button>
                <button class="menu-item" data-target="npcs">
                    <span class="menu-icon">🤖</span>
                    <span class="menu-label">NPC</span>
                </button>
            </nav>
        </aside>

        <!-- ── Main panel ── -->
        <main class="main-panel">
            <!-- Nút mở sidebar trên mobile — cố định góc trên phải -->
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Mở menu">☰</button>

            <header class="topbar">
                <div class="topbar-left">
                    <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar">☰</button>
                    <div>
                        <p class="eyebrow">Trang quản trị</p>
                        <h2 id="page-title">Quản lý tài khoản</h2>
                    </div>
                </div>
                <button id="btn-add" class="primary-btn">+ Thêm mới</button>
            </header>

            <!--
                Các section module được load động từ partials/*.html.
                Mỗi file partial chứa một <section class="module" id="..."> độc lập.
            -->
            <div id="modules-container"></div>
        </main>
    </div>

    <!-- ── Modal dùng chung cho mọi module ── -->
    <div id="entity-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close="true"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">Thêm mới</h3>
                <button type="button" class="modal-close" aria-label="Đóng">×</button>
            </div>
            <form id="modal-form" class="entity-form">
                <input type="hidden" name="id" />
                <div id="modal-fields" class="grid-2"></div>
                <div class="form-actions">
                    <button type="submit" class="primary-btn">Lưu</button>
                    <button type="button" class="secondary-btn" data-close="true">Hủy</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
