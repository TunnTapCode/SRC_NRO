<link rel="stylesheet" href="/admin/css/maps.css" />

<section class="module" id="maps">

    <!-- Banner -->
    <div class="mp-banner">
        <div class="mp-banner-left">
            <img class="mp-banner-avatar" src="/data/effect/x1/ImgEffect_4.png"
                 onerror="this.src=''" alt="maps" />
            <div class="mp-banner-info">
                <h2 class="mp-banner-title">
                    Bản Đồ
                    <span class="mp-badge" id="mp-total-badge">Tổng: 0</span>
                </h2>
                <div class="mp-banner-actions">
                    <button class="mp-btn mp-btn-panel"   onclick="showTab('dashboard')">🏠 Go Panel</button>
                    <button class="mp-btn mp-btn-refresh" onclick="mpLoad()">🔄 Làm Mới</button>
                    <button class="mp-btn mp-btn-add"     id="mp-add-btn">＋ Thêm Bản Đồ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="mp-toolbar">
        <div class="mp-toolbar-left">
            <div class="mp-search-wrap">
                <span>🔍</span>
                <input id="mp-search" class="mp-search-input" type="text"
                       placeholder="Tìm tên bản đồ hoặc ID..." />
            </div>
            <select id="mp-filter-planet" class="mp-filter-select">
                <option value="">🌍 Tất cả hành tinh</option>
                <option value="0">🌍 Trái Đất</option>
                <option value="1">🟢 Namếc</option>
                <option value="2">🟡 Xayda</option>
            </select>
        </div>
        <div class="mp-toolbar-right">
            <div class="mp-stat-chips" id="mp-chips"></div>
        </div>
    </div>

    <!-- Pagination top -->
    <div class="mp-pagination" id="mp-pagination-top"></div>

    <!-- Table -->
    <div class="mp-table-card">
        <table class="mp-table">
            <thead>
                <tr>
                    <th style="width:52px">ID</th>
                    <th>Tên bản đồ</th>
                    <th style="width:110px">Loại</th>
                    <th style="width:100px">Hành tinh</th>
                    <th style="width:60px;text-align:center">Zone</th>
                    <th style="width:70px;text-align:center">Max NV</th>
                    <th style="min-width:140px">Danh Sách Quái</th>
                    <th style="min-width:160px">Danh Sách NPC</th>
                    <th style="width:60px;text-align:center">Cổng</th>
                    <th style="width:110px;text-align:center">Hành động</th>
                </tr>
            </thead>
            <tbody id="mp-table-body">
                <tr><td colspan="10" class="mp-empty">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination bottom -->
    <div class="mp-pagination" id="mp-pagination-bot" style="margin-top:14px;margin-bottom:0"></div>

    <!-- Drawer được inject vào body khi mở (tránh bị clip bởi parent) -->

</section>

<script>
(function () {

    /* ═══════════════ json helpers ═══════════════ */

    /**
     * Parse chuỗi JSON lồng nhau từ DB (escape ký tự) thành mảng JS.
     * Dùng để hiển thị đẹp trong textarea.
     */
    function parseDbJson(raw) {
        if (!raw || raw === '[]') return [];
        try {
            // Thử parse trực tiếp trước
            const parsed = JSON.parse(raw);
            // Nếu phần tử là chuỗi lồng (format DB cũ) → parse tiếp từng phần tử
            if (Array.isArray(parsed) && parsed.length > 0 && typeof parsed[0] === 'string') {
                return parsed.map(s => { try { return JSON.parse(s); } catch (_) { return s; } });
            }
            return parsed;
        } catch (_) {
            try {
                const cleaned = raw
                    .replace(/\[\"\[/g, '[[').replace(/\]\"\]/g, ']]').replace(/\",\"/g, ',');
                return JSON.parse(cleaned);
            } catch (_) { return []; }
        }
    }

    /** Hiển thị JSON đẹp trong textarea — mỗi phần tử trên 1 dòng */
    function prettyJsonField(raw) {
        try {
            const arr = parseDbJson(raw);
            if (!arr.length) return '[]';
            const lines = arr.map(item => '  ' + JSON.stringify(item));
            return '[\n' + lines.join(',\n') + '\n]';
        } catch (_) {
            return raw || '[]';
        }
    }

    /**
     * Compact lại từ textarea (pretty) về format DB cũ dạng
     * mảng chuỗi lồng: ["[0,1,100,...]","[1,2,200,...]"]
     * Waypoints dùng format lồng tương tự.
     */
    function compactToDbFormat(value) {
        try {
            const arr = JSON.parse(value);
            if (!Array.isArray(arr) || arr.length === 0) return '[]';
            // Nếu phần tử đã là mảng → wrap lại thành chuỗi lồng (format DB)
            if (Array.isArray(arr[0])) {
                return JSON.stringify(arr.map(item => JSON.stringify(item)));
            }
            // Đã là mảng phẳng / format mới → giữ nguyên
            return JSON.stringify(arr);
        } catch (_) {
            return value; // giữ nguyên nếu parse lỗi
        }
    }

    /** Nút Format bấm vào → làm đẹp textarea */
    document.addEventListener('click', e => {
        const btn = e.target.closest('.mp-json-fmt-btn');
        if (!btn) return;
        const ta = document.getElementById(btn.dataset.target);
        if (!ta) return;
        ta.value = prettyJsonField(ta.value);
        ta.style.minHeight = Math.min(400, Math.max(90, ta.value.split('\n').length * 20)) + 'px';
    });
    const PAGE_SIZE = 25;

    const TYPE_LABELS = {
        0: { icon:'🌿', label:'Bình thường',   cls:'mp-type-0' },
        1: { icon:'🏠', label:'Offline / Nhà', cls:'mp-type-1' },
        2: { icon:'⚔️', label:'Doanh trại',    cls:'mp-type-2' },
        3: { icon:'🔮', label:'Chiến trận',     cls:'mp-type-3' },
        4: { icon:'🗺️', label:'Kho báu',        cls:'mp-type-4' },
        5: { icon:'👹', label:'Majin Buu',      cls:'mp-type-5' },
        6: { icon:'🐍', label:'Rắn độc',        cls:'mp-type-6' },
    };

    const PLANET_LABELS = {
        0: { icon:'🌍', label:'Trái Đất' },
        1: { icon:'🟢', label:'Namếc'   },
        2: { icon:'🟡', label:'Xayda'   },
    };

    /* ═══════════════ state ═══════════════ */
    let _all      = [];   // toàn bộ maps từ API
    let _filtered = [];   // sau filter/search
    let _page     = 1;
    let _npcCache = {};   // { npcId: npcRow }
    let _mobCache = {};   // { mobId: { id, NAME, TYPE } }
    let _current  = null; // map đang mở drawer

    let _filterType   = null;
    let _filterPlanet = '';
    let _searchQ      = '';

    /* ═══════════════ helpers ═══════════════ */
    function parseJsonSafe(raw) {
        if (!raw || raw === '[]' || raw === '{}') return [];
        try {
            // Xử lý escape lồng nhau giống server Java
            const cleaned = raw
                .replace(/\[\"\[/g, '[[')
                .replace(/\]\"\]/g, ']]')
                .replace(/\",\"/g, ',')
                .replace(/\\"/g, '"');
            return JSON.parse(cleaned);
        } catch (_) {
            try { return JSON.parse(raw); } catch (_) { return []; }
        }
    }

    /**
     * Trả về mảng NPC thô [[id,x,y], ...] — giữ nguyên nguyên các phần tử gốc
     * trong DB để không làm mất dữ liệu khi ghi lại.
     */
    function parseNpcsArr(raw) {
        if (!raw) return [];
        try {
            const outer = JSON.parse(String(raw).replace(/\\"/g, '"'));
            if (!Array.isArray(outer)) return [];
            return outer.map(entry => {
                try {
                    const inner = typeof entry === 'string' ? JSON.parse(entry) : entry;
                    return Array.isArray(inner) ? inner : null;
                } catch (_) { return null; }
            }).filter(Boolean);
        } catch (_) { return []; }
    }

    function parseNpcs(raw) {
        return parseNpcsArr(raw).map(inner => ({ id: inner[0], x: inner[1], y: inner[2] }));
    }

    function parseMobs(raw) {
        if (!raw) return [];
        try {
            const outer = JSON.parse(raw.replace(/\\"/g, '"').replace(/\"\[/g,'[').replace(/\]\"/g,']'));
            return outer.map(entry => {
                try {
                    const inner = typeof entry === 'string' ? JSON.parse(entry) : entry;
                    return { tempId: inner[0], level: inner[1], hp: inner[2], x: inner[3], y: inner[4] };
                } catch (_) { return null; }
            }).filter(Boolean);
        } catch (_) { return []; }
    }

    function parseWaypoints(raw) {
        if (!raw) return [];
        try {
            const cleaned = raw
                .replace(/\[\"\[/g,'[[').replace(/\]\"\]/g,']]').replace(/\",\"/g,',');
            const outer = JSON.parse(cleaned);
            return outer.map(entry => {
                try {
                    const inner = typeof entry === 'string' ? JSON.parse(entry) : entry;
                    return {
                        name:    inner[0], minX: inner[1], minY: inner[2],
                        maxX:    inner[3], maxY: inner[4],
                        isEnter:   inner[5], isOffline: inner[6],
                        goMap: inner[7], goX: inner[8], goY: inner[9]
                    };
                } catch (_) { return null; }
            }).filter(Boolean);
        } catch (_) { return []; }
    }

    function typeBadge(type) {
        const t = TYPE_LABELS[type] || { icon:'❓', label:`Type ${type}`, cls:'mp-type-other' };
        return `<span class="mp-type-badge ${t.cls}">${t.icon} ${t.label}</span>`;
    }

    function planetLabel(pid) {
        const p = PLANET_LABELS[pid];
        return p ? `<span class="mp-planet">${p.icon} ${p.label}</span>` : `<span class="mp-planet">🪐 #${pid}</span>`;
    }

    /* ═══════════════ load ═══════════════ */
    async function mpLoad() {
        document.getElementById('mp-table-body').innerHTML =
            '<tr><td colspan="10" class="mp-empty">⏳ Đang tải...</td></tr>';

        const [maps, npcs, mobsData] = await Promise.all([
            fetch('/api/maps').then(r => r.json()).catch(() => []),
            fetch('/api/npcs').then(r => r.json()).catch(() => []),
            fetch('/api/mobs').then(r => r.json()).catch(() => []),
        ]);

        _all = Array.isArray(maps) ? maps : [];
        _npcCache = {};
        (Array.isArray(npcs) ? npcs : []).forEach(n => { _npcCache[String(n.id)] = n; });
        _mobCache = {};
        (Array.isArray(mobsData) ? mobsData : []).forEach(m => { _mobCache[String(m.id)] = m; });

        // Badge tổng
        const badge = document.getElementById('mp-total-badge');
        if (badge) badge.textContent = 'Tổng: ' + _all.length;

        renderChips();
        applyFilter();
    }

    window.mpLoad = mpLoad;

    /* ═══════════════ chips thống kê ═══════════════ */
    function renderChips() {
        const container = document.getElementById('mp-chips');
        if (!container) return;
        const counts = {};
        _all.forEach(m => { counts[m.type] = (counts[m.type] || 0) + 1; });
        let html = `<span class="mp-chip mp-chip-all ${_filterType === null ? 'active' : ''}"
                         onclick="mpFilterType(null)">
                    🗺️ Tất cả (${_all.length})
                   </span>`;
        Object.entries(counts).sort((a,b) => a[0]-b[0]).forEach(([t, cnt]) => {
            const info = TYPE_LABELS[t] || { icon:'❓', label:`Type ${t}` };
            const cls  = ['mp-chip-normal','mp-chip-offline','mp-chip-special','mp-chip-event'][t] || 'mp-chip-all';
            html += `<span class="mp-chip ${cls} ${_filterType == t ? 'active' : ''}"
                          onclick="mpFilterType(${t})">
                     ${info.icon} ${info.label} (${cnt})
                    </span>`;
        });
        container.innerHTML = html;
    }

    window.mpFilterType = function(type) {
        _filterType = type;
        _page = 1;
        renderChips();
        applyFilter();
    };

    /* ═══════════════ filter ═══════════════ */
    function applyFilter() {
        const q = _searchQ.toLowerCase();
        _filtered = _all.filter(m => {
            if (_filterType !== null && Number(m.type) !== _filterType) return false;
            if (_filterPlanet !== '' && String(m.planet_id) !== _filterPlanet) return false;
            if (q && !String(m.NAME).toLowerCase().includes(q) && !String(m.id).includes(q)) return false;
            return true;
        });
        _page = 1;
        renderTable();
        renderPagination();
    }

    /* ═══════════════ render table ═══════════════ */
    function renderTable() {
        const tbody = document.getElementById('mp-table-body');
        if (!tbody) return;
        const start = (_page - 1) * PAGE_SIZE;
        const rows  = _filtered.slice(start, start + PAGE_SIZE);

        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="mp-empty">Không có bản đồ nào</td></tr>';
            return;
        }

        tbody.innerHTML = rows.map(m => {
            const mobs = parseMobs(m.mobs);
            const npcs = parseNpcs(m.npcs);
            const wps  = parseWaypoints(m.waypoints);

            // Danh sách quái — badge nhỏ hiện tên/id, unique theo tempId
            const uniqueMobIds = [...new Set(mobs.map(mb => mb.tempId))];
            const mobsHtml = uniqueMobIds.length
                ? uniqueMobIds.map(id => {
                    const mb = _mobCache[String(id)] || {};
                    const name = mb.NAME || `Mob #${id}`;
                    return `<span class="mp-mob-badge" title="${name} (ID: ${id})">
                                👾 ${name}
                            </span>`;
                  }).join('')
                : '<span class="mp-col-empty">—</span>';

            // Danh sách NPC — avatar icon
            const npcsHtml = npcs.length
                ? `<div class="mp-npc-chips-wrap">${npcs.map(n => {
                    const nd = _npcCache[String(n.id)] || {};
                    const av = nd.avatar;
                    return `<span class="mp-npc-chip" title="${nd.NAME || 'NPC #'+n.id}">
                                ${av
                                    ? `<img src="/data/icon/x1/${av}.png" onerror="this.style.display='none'" />`
                                    : '<span class="mp-npc-chip-fallback">🤖</span>'}
                            </span>`;
                  }).join('')}</div>`
                : '<span class="mp-col-empty">—</span>';

            return `
            <tr>
                <td class="mp-td-id">${m.id}</td>
                <td class="mp-td-name">${m.NAME}</td>
                <td>${typeBadge(m.type)}</td>
                <td>${planetLabel(m.planet_id)}</td>
                <td class="mp-td-right">${m.zones}</td>
                <td class="mp-td-right">${m.max_player}</td>
                <td class="mp-col-mobs">${mobsHtml}</td>
                <td class="mp-col-npcs">${npcsHtml}</td>
                <td class="mp-td-right">${wps.length  || '—'}</td>
                <td style="text-align:center;white-space:nowrap">
                    <button class="mp-act-btn mp-act-detail"
                            onclick="mpOpenDrawer(${m.id},'info')" title="Chi tiết">🔍</button>
                    <button class="mp-act-btn mp-act-edit"
                            onclick="mpOpenDrawer(${m.id},'edit')" title="Sửa">✏️</button>
                    <button class="mp-act-btn mp-act-delete"
                            onclick="mpDelete(${m.id})" title="Xóa">🗑</button>
                </td>
            </tr>`;
        }).join('');
    }

    /* ═══════════════ pagination ═══════════════ */
    function renderPagination() {
        const total = Math.max(1, Math.ceil(_filtered.length / PAGE_SIZE));
        const range = 3;
        let html = '';
        for (let i = 1; i <= total; i++) {
            if (i === 1 || i === total || (i >= _page - range && i <= _page + range)) {
                html += `<button class="mp-page-btn ${i === _page ? 'active' : ''}"
                                 onclick="mpGoPage(${i})">${i}</button>`;
            } else if (i === _page - range - 1 || i === _page + range + 1) {
                html += `<span class="mp-page-ellipsis">…</span>`;
            }
        }
        ['mp-pagination-top','mp-pagination-bot'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = html;
        });
    }

    window.mpGoPage = function(p) { _page = p; renderTable(); renderPagination(); window.scrollTo(0,0); };

    /* ═══════════════ drawer ═══════════════ */
    /* ═══════════════ drawer — tạo động append vào body ═══════════════ */
    function getOrCreateDrawer() {
        let drawer = document.getElementById('mp-drawer');
        if (drawer) return drawer;

        // Tạo drawer và append thẳng vào body để position:fixed không bị clip
        drawer = document.createElement('div');
        drawer.id = 'mp-drawer';
        drawer.className = 'mp-drawer';
        drawer.setAttribute('aria-hidden', 'true');
        drawer.innerHTML = `
            <div class="mp-drawer-backdrop"></div>
            <div class="mp-drawer-panel">
                <div class="mp-drawer-header">
                    <div class="mp-drawer-title-wrap">
                        <span class="mp-drawer-icon">🗺️</span>
                        <div>
                            <h3 id="mp-drawer-title">Bản đồ</h3>
                            <p  id="mp-drawer-sub"></p>
                        </div>
                    </div>
                    <button class="mp-drawer-close" id="mp-drawer-close-btn">×</button>
                </div>
                <div class="mp-drawer-tabs">
                    <button class="mp-drawer-tab active" data-pane="info">📋 Thông tin</button>
                    <button class="mp-drawer-tab" data-pane="mobs">👾 Mob</button>
                    <button class="mp-drawer-tab" data-pane="npcs">🤖 NPC</button>
                    <button class="mp-drawer-tab" data-pane="waypoints">🚪 Cổng</button>
                    <button class="mp-drawer-tab" data-pane="edit">✏️ Sửa</button>
                </div>
                <div class="mp-drawer-body">
                    <div class="mp-pane active" id="mp-pane-info"></div>
                    <div class="mp-pane" id="mp-pane-mobs"></div>
                    <div class="mp-pane" id="mp-pane-npcs"></div>
                    <div class="mp-pane" id="mp-pane-waypoints"></div>
                    <div class="mp-pane" id="mp-pane-edit"></div>
                </div>
            </div>`;

        document.body.appendChild(drawer);

        // Gắn events sau khi đã append
        drawer.querySelector('.mp-drawer-backdrop').addEventListener('click', mpCloseDrawer);
        drawer.querySelector('#mp-drawer-close-btn').addEventListener('click', mpCloseDrawer);
        drawer.addEventListener('click', e => {
            const tab = e.target.closest('.mp-drawer-tab');
            if (tab) switchPane(tab.dataset.pane);
        });

        return drawer;
    }

    window.mpOpenDrawer = function(id, pane) {
        _current = _all.find(m => Number(m.id) === Number(id));
        if (!_current) return;

        // Tạo drawer trước (append vào body) rồi mới điền nội dung
        const drawer = getOrCreateDrawer();

        const m    = _current;
        const mobs = parseMobs(m.mobs);
        const npcs = parseNpcs(m.npcs);
        const wps  = parseWaypoints(m.waypoints);

        // Header
        document.getElementById('mp-drawer-title').textContent = `[${m.id}] ${m.NAME}`;
        document.getElementById('mp-drawer-sub').textContent   =
            `${(TYPE_LABELS[m.type]||{label:'?'}).label} · ${(PLANET_LABELS[m.planet_id]||{label:'?'}).label}`;

        // Pane: Thông tin
        document.getElementById('mp-pane-info').innerHTML = `
            <div class="mp-info-grid">
                <div class="mp-info-item"><div class="mp-info-label">ID</div>
                    <div class="mp-info-value">${m.id}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Tên</div>
                    <div class="mp-info-value">${m.NAME}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Loại</div>
                    <div class="mp-info-value">${typeBadge(m.type)}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Hành tinh</div>
                    <div class="mp-info-value">${planetLabel(m.planet_id)}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Số zone</div>
                    <div class="mp-info-value">${m.zones}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Max player / zone</div>
                    <div class="mp-info-value">${m.max_player}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Tile ID</div>
                    <div class="mp-info-value">${m.tile_id ?? '—'}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">BG ID</div>
                    <div class="mp-info-value">${m.bg_id ?? '—'}</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Mob trên map</div>
                    <div class="mp-info-value">${mobs.length} loại</div></div>
                <div class="mp-info-item"><div class="mp-info-label">NPC trên map</div>
                    <div class="mp-info-value" id="mp-info-npc-count">${npcs.length} NPC</div></div>
                <div class="mp-info-item"><div class="mp-info-label">Cổng dịch chuyển</div>
                    <div class="mp-info-value">${wps.length} cổng</div></div>
            </div>`;

        // Pane: Mob
        document.getElementById('mp-pane-mobs').innerHTML = mobs.length
            ? `<div class="mp-section-title">👾 Danh sách mob (${mobs.length})</div>
               <div class="mp-mob-list">${mobs.map((mb, i) => {
                   const mobData = _mobCache[String(mb.tempId)] || {};
                   const mobName = mobData.NAME || `Mob #${mb.tempId}`;
                   return `
                <div class="mp-mob-row" style="animation-delay:${i*40}ms">
                    <div class="mp-mob-id">${mb.tempId}</div>
                    <div class="mp-mob-info">
                        <div class="mp-mob-name">${mobName}</div>
                        <div class="mp-mob-meta">Lv.${mb.level} · HP: ${Number(mb.hp).toLocaleString('vi-VN')}</div>
                    </div>
                    <span class="mp-mob-coords">📍 ${mb.x}, ${mb.y}</span>
                </div>`;
               }).join('')}</div>`
            : '<div class="mp-empty">Không có mob nào</div>';

        // Pane: NPC (render động — có nút "＋ Thêm NPC")
        renderNpcPane(m);

        // Pane: Waypoints
        document.getElementById('mp-pane-waypoints').innerHTML = wps.length
            ? `<div class="mp-section-title">🚪 Cổng dịch chuyển (${wps.length})</div>
               <div class="mp-wp-list">${wps.map((wp, i) => `
                <div class="mp-wp-row" style="animation-delay:${i*40}ms">
                    <div class="mp-wp-name">🚪 ${wp.name || '(không tên)'}</div>
                    <div class="mp-wp-meta">
                        <span class="mp-wp-tag mp-wp-tag-goto">→ Map #${wp.goMap} (${wp.goX},${wp.goY})</span>

                        ${wp.isEnter   ? '<span class="mp-wp-tag mp-wp-tag-enter">Cổng vào nhà</span>' : ''}
                        ${wp.isOffline ? '<span class="mp-wp-tag mp-wp-tag-offline">Map offline</span>' : ''}
                    </div>
                </div>`).join('')}</div>`
            : '<div class="mp-empty">Không có cổng dịch chuyển</div>';

        // Pane: Sửa
        renderEditPane(m);

        // Mở drawer — đã append vào body, position:fixed luôn đúng
        drawer.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        // Chuyển sang pane được chọn
        switchPane(pane || 'info');
    };

    window.mpCloseDrawer = function() {
        const drawer = document.getElementById('mp-drawer');
        if (!drawer) return;
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        _current = null;
    };

    /* ── Drawer tab switching ── */
    function switchPane(pane) {
        const drawer = document.getElementById('mp-drawer');
        if (!drawer) return;
        drawer.querySelectorAll('.mp-drawer-tab').forEach(b =>
            b.classList.toggle('active', b.dataset.pane === pane)
        );
        drawer.querySelectorAll('.mp-pane').forEach(p =>
            p.classList.toggle('active', p.id === `mp-pane-${pane}`)
        );
    }

    document.addEventListener('click', e => {
        const tab = e.target.closest('.mp-drawer-tab');
        if (tab && document.getElementById('mp-drawer')?.classList.contains('open')) {
            switchPane(tab.dataset.pane);
        }
    });

    /* ═══════════════ Pane: NPC (nút "＋ Thêm NPC") ═══════════════ */

    let _npcPickerTimer = null;

    /** Tải lại danh sách NPC nếu cache đang rỗng */
    async function ensureNpcCache() {
        if (Object.keys(_npcCache).length) return;
        const npcs = await fetch('/api/npcs').then(r => r.json()).catch(() => []);
        _npcCache = {};
        (Array.isArray(npcs) ? npcs : []).forEach(n => { _npcCache[String(n.id)] = n; });
    }

    /** Mở / đóng form thêm NPC (nếu cache NPC rỗng thì tải trước rồi mới mở) */
    async function toggleNpcAddForm(force) {
        if (!_current) return;
        let form = document.getElementById('mp-npc-add-form');
        if (!form) return;
        const willOpen = typeof force === 'boolean' ? force : !form.classList.contains('open');
        if (willOpen && !Object.keys(_npcCache).length) {
            await ensureNpcCache();
            renderNpcPane(_current);
            form = document.getElementById('mp-npc-add-form');
            if (!form) return;
            form.classList.add('open');
            return;
        }
        form.classList.toggle('open', willOpen);
    }

    /* ── Modal Chọn NPC (Picker) với Avatar ── */
    function openNpcPicker() {
        let picker = document.getElementById('mp-npc-picker');
        if (!picker) {
            picker = document.createElement('div');
            picker.id = 'mp-npc-picker';
            picker.className = 'mp-picker-overlay mp-hidden';
            picker.innerHTML = `
                <div class="mp-picker-dialog">
                    <div class="mp-picker-header">
                        <h3>🤖 Chọn NPC vào bản đồ</h3>
                        <div class="mp-picker-search-wrap">
                            <span>🔍</span>
                            <input id="mp-npc-picker-search" type="text" placeholder="Tìm theo tên NPC hoặc ID..." autocomplete="off" />
                        </div>
                        <button id="mp-npc-picker-close" type="button">✕</button>
                    </div>
                    <div id="mp-npc-picker-grid" class="mp-picker-grid"></div>
                </div>`;
            document.body.appendChild(picker);
        }

        renderNpcPickerGrid('');
        picker.classList.remove('mp-hidden');
        document.body.style.overflow = 'hidden';
        const searchInput = document.getElementById('mp-npc-picker-search');
        if (searchInput) {
            searchInput.value = '';
            setTimeout(() => searchInput.focus(), 80);
        }

    function closeNpcPicker() {
        const picker = document.getElementById('mp-npc-picker');
        if (picker) picker.classList.add('mp-hidden');
        const drawer = document.getElementById('mp-drawer');
        if (!drawer || !drawer.classList.contains('open')) {
            document.body.style.overflow = '';
        }
    }

    function renderNpcPickerGrid(q) {
        const grid = document.getElementById('mp-npc-picker-grid');
        if (!grid) return;
        const query = (q || '').trim().toLowerCase();
        let list = Object.values(_npcCache || {}).sort((a, b) => Number(a.id) - Number(b.id));

        if (query) {
            list = list.filter(n => {
                const name = (n.NAME || '').toLowerCase();
                const idStr = String(n.id);
                return name.includes(query) || idStr.includes(query);
            });
        }

        if (!list.length) {
            grid.innerHTML = '<div class="mp-picker-empty">Không tìm thấy NPC nào phù hợp</div>';
            return;
        }

        grid.innerHTML = list.map(n => {
            const av = n.avatar;
            const avatarHtml = av
                ? `<img src="/data/icon/x4/${av}.png" onerror="this.src='/data/icon/x1/${av}.png';this.onerror=()=>{this.style.display='none';this.parentElement.textContent='🤖';}" alt="${n.NAME || ''}" />`
                : '🤖';
            return `
                <div class="mp-picker-item" data-id="${n.id}" title="${n.NAME || 'NPC #' + n.id}">
                    <div class="mp-picker-avatar">${avatarHtml}</div>
                    <div class="mp-picker-name">${n.NAME || 'NPC #' + n.id}</div>
                    <div class="mp-picker-id">#${n.id}</div>
                </div>`;
        }).join('');

        grid.querySelectorAll('.mp-picker-item').forEach(el => {
            el.addEventListener('click', () => {
                const id = Number(el.dataset.id);
                setAddNpcSelected(id);
                closeNpcPicker();
                document.getElementById('mp-npc-add-x')?.focus();
            });
        });
    }

    /** Gửi yêu cầu thêm NPC vào bản đồ (PUT /api/maps/{id}) */
    async function confirmAddNpc() {
        if (!_current || _current.id === null) {
            toast('Hãy lưu bản đồ trước khi thêm NPC.', 'warning');
            return;
        }
        const hiddenInp = document.getElementById('mp-npc-add-id');
        const xEl = document.getElementById('mp-npc-add-x');
        const yEl = document.getElementById('mp-npc-add-y');

        const npcIdVal = hiddenInp?.value || (_selectedAddNpcId !== null ? String(_selectedAddNpcId) : '');
        if (!npcIdVal) {
            toast('Hãy nhấn chọn NPC cần thêm.', 'warning');
            openNpcPicker();
            return;
        }

        const npcId = Number(npcIdVal);
        const x = Number(xEl.value), y = Number(yEl.value);
        if (xEl.value === '' || yEl.value === '' || !Number.isFinite(x) || !Number.isFinite(y)) {
            toast('Toạ độ X / Y không hợp lệ.', 'warning');
            return;
        }

        const list = parseNpcsArr(_current.npcs);
        if (list.some(e => Number(e[0]) === npcId)) {
            toast(`NPC #${npcId} đã có sẵn trên bản đồ này.`, 'warning');
            return;
        }
        list.push([npcId, Math.round(x), Math.round(y)]);

        // Format DB: ["[id,x,y]","[id,x,y]"] — giống nút ⬡ Format / mpSave
        const npcsDb = JSON.stringify(list.map(e => JSON.stringify(e)));

        // PUT bắt buộc gửi đủ các field (thiếu field sẽ bị ghi NULL)
        const payload = {
            NAME:       _current.NAME,
            zones:      _current.zones,
            max_player: _current.max_player,
            type:       _current.type,
            planet_id:  _current.planet_id,
            bg_type:    _current.bg_type,
            tile_id:    _current.tile_id,
            bg_id:      _current.bg_id,
            data:       _current.data      || '[]',
            waypoints:  _current.waypoints || '[]',
            mobs:       _current.mobs      || '[]',
            npcs:       npcsDb,
        };

        try {
            const res  = await fetch(`/api/maps/${_current.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!data.success) {
                toast('Thêm NPC thất bại: ' + (data.message || ''), 'error');
                return;
            }

            // Cập nhật cache local
            _current.npcs = npcsDb;
            const idx = _all.findIndex(mm => Number(mm.id) === Number(_current.id));
            if (idx >= 0) _all[idx].npcs = npcsDb;

            // Reset selection
            _selectedAddNpcId = null;
            renderNpcPane(_current);
            const count = document.getElementById('mp-info-npc-count');
            if (count) count.textContent = list.length + ' NPC';
            renderTable();

            const nd = _npcCache[String(npcId)] || {};
            toast(`Đã thêm NPC ${nd.NAME || '#' + npcId} vào bản đồ!`, 'success');
        } catch (e) { toast('Lỗi kết nối: ' + e.message, 'error'); }
    }

    /** Xóa NPC khỏi bản đồ hiện tại (xác nhận 2 bước bằng confirmByToast) */
    async function deleteMapNpc(npcId, npcName) {
        if (!_current || _current.id === null) return;
        const name = npcName || ('#' + npcId);

        const list = parseNpcsArr(_current.npcs);
        const nextList = list.filter(e => Number(e[0]) !== Number(npcId));

        if (list.length === nextList.length) {
            toast('Không tìm thấy NPC để xóa.', 'warning');
            return;
        }

        const npcsDb = JSON.stringify(nextList.map(e => JSON.stringify(e)));
        const payload = {
            NAME:       _current.NAME,
            zones:      _current.zones,
            max_player: _current.max_player,
            type:       _current.type,
            planet_id:  _current.planet_id,
            bg_type:    _current.bg_type,
            tile_id:    _current.tile_id,
            bg_id:      _current.bg_id,
            data:       _current.data      || '[]',
            waypoints:  _current.waypoints || '[]',
            mobs:       _current.mobs      || '[]',
            npcs:       npcsDb,
        };

        try {
            const res = await fetch(`/api/maps/${_current.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!data.success) {
                toast('Xóa NPC thất bại: ' + (data.message || ''), 'error');
                return;
            }

            _current.npcs = npcsDb;
            const idx = _all.findIndex(mm => Number(mm.id) === Number(_current.id));
            if (idx >= 0) _all[idx].npcs = npcsDb;

            renderNpcPane(_current);
            const count = document.getElementById('mp-info-npc-count');
            if (count) count.textContent = nextList.length + ' NPC';
            renderTable();

            toast(`Đã xóa NPC ${name} khỏi bản đồ!`, 'success');
        } catch (e) { toast('Lỗi kết nối: ' + e.message, 'error'); }
    }

    /* ── Events cho form thêm NPC (event delegation) ── */
    document.addEventListener('click', async e => {
        const delBtn = e.target.closest('.mp-npc-del-btn');
        if (delBtn) {
            const npcId = Number(delBtn.dataset.npcid);
            const npcName = delBtn.dataset.npcname;
            const ok = await showConfirmModal({
                title: 'Xóa NPC khỏi bản đồ?',
                message: `Xóa NPC ${npcName || '#' + npcId} khỏi bản đồ "${_current?.NAME || ''}"? Hành động này sẽ lưu ngay vào server.`,
                confirmText: '🗑️ Xóa NPC',
            });
            if (ok) deleteMapNpc(npcId, npcName);
            return;
        }
        if (e.target.closest('#mp-npc-add-btn'))      { toggleNpcAddForm();      return; }
        if (e.target.closest('#mp-npc-add-cancel'))   { toggleNpcAddForm(false); return; }
        if (e.target.closest('#mp-npc-add-confirm'))  { confirmAddNpc();         return; }
        if (e.target.closest('#mp-npc-pick-trigger')) { openNpcPicker();         return; }
        if (e.target.id === 'mp-npc-picker-close' || e.target.id === 'mp-npc-picker') {
            closeNpcPicker();
            return;
        }
    });

    document.addEventListener('input', e => {
        if (e.target.id === 'mp-npc-picker-search') {
            clearTimeout(_npcPickerTimer);
            _npcPickerTimer = setTimeout(() => renderNpcPickerGrid(e.target.value), 160);
        }
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            const picker = document.getElementById('mp-npc-picker');
            if (picker && !picker.classList.contains('mp-hidden')) {
                closeNpcPicker();
            }
        }
    });

    /* ── Save ── */
    window.mpSave = async function() {
        if (!_current) return;
        const payload = {
            NAME:       document.getElementById('mp-edit-name').value,
            type:       document.getElementById('mp-edit-type').value,
            planet_id:  document.getElementById('mp-edit-planet').value,
            zones:      document.getElementById('mp-edit-zones').value,
            max_player: document.getElementById('mp-edit-max').value,
            tile_id:    document.getElementById('mp-edit-tile').value,
            bg_id:      document.getElementById('mp-edit-bg').value,
            bg_type:    document.getElementById('mp-edit-bgtype').value,
            mobs:       compactToDbFormat(document.getElementById('mp-edit-mobs').value),
            npcs:       compactToDbFormat(document.getElementById('mp-edit-npcs').value),
            waypoints:  compactToDbFormat(document.getElementById('mp-edit-waypoints').value),
            data:       _current.data || '[]',
        };
        try {
            const res  = await fetch(`/api/maps/${_current.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (data.success) {
                // Cập nhật cache local
                Object.assign(_current, payload);
                const idx = _all.findIndex(m => Number(m.id) === Number(_current.id));
                if (idx >= 0) Object.assign(_all[idx], payload);
                toast('Đã lưu bản đồ!', 'success');
                mpCloseDrawer();
                applyFilter();
            } else {
                toast('Lưu thất bại: ' + (data.message || ''), 'error');
            }
        } catch (e) { toast('Lỗi kết nối: ' + e.message, 'error'); }
    };

    /* ── Delete ── */
    window.mpDelete = async function(id) {
        const m = _all.find(x => Number(x.id) === Number(id));
        if (!m) return;
        const ok = await showConfirmModal({
            title: 'Xóa bản đồ?',
            message: `Xóa bản đồ "${m.NAME}" (ID: ${id})? Dữ liệu sẽ bị xóa vĩnh viễn.`,
            confirmText: '🗑️ Xóa bản đồ',
        });
        if (!ok) return;
        try {
            const res  = await fetch(`/api/maps/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                _all      = _all.filter(x => Number(x.id) !== Number(id));
                _filtered = _filtered.filter(x => Number(x.id) !== Number(id));
                const badge = document.getElementById('mp-total-badge');
                if (badge) badge.textContent = 'Tổng: ' + _all.length;
                toast('Đã xóa!', 'success');
                renderChips(); renderTable(); renderPagination();
            } else { toast('Xóa thất bại!', 'error'); }
        } catch (e) { toast('Lỗi: ' + e.message, 'error'); }
    };

    /* ── Add map (mở drawer trống) ── */
    document.addEventListener('click', e => {
        if (e.target.id !== 'mp-add-btn') return;
        _current = { id: null, NAME:'', type:0, planet_id:0, zones:8, max_player:12,
                     tile_id:1, bg_id:0, bg_type:0, data:'[]', mobs:'[]', npcs:'[]', waypoints:'[]' };
        document.getElementById('mp-drawer-title').textContent = 'Thêm bản đồ mới';
        document.getElementById('mp-drawer-sub').textContent   = '';
        ['info','mobs','npcs','waypoints'].forEach(p =>
            { document.getElementById(`mp-pane-${p}`).innerHTML = '<div class="mp-empty">Điền thông tin rồi lưu</div>'; }
        );
        renderEditPane(_current);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
            const drawer = getOrCreateDrawer();
            drawer.classList.add('open');
            drawer.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            switchPane('edit');
        }, 0);
    });

    // Override save cho trường hợp thêm mới
    const _origSave = window.mpSave;
    window.mpSave = async function() {
        if (_current && _current.id === null) {
            const payload = {
                NAME:       document.getElementById('mp-edit-name').value,
                type:       document.getElementById('mp-edit-type').value,
                planet_id:  document.getElementById('mp-edit-planet').value,
                zones:      document.getElementById('mp-edit-zones').value,
                max_player: document.getElementById('mp-edit-max').value,
                tile_id:    document.getElementById('mp-edit-tile').value,
                bg_id:      document.getElementById('mp-edit-bg').value,
                bg_type:    document.getElementById('mp-edit-bgtype').value,
                mobs:       compactToDbFormat(document.getElementById('mp-edit-mobs').value),
                npcs:       compactToDbFormat(document.getElementById('mp-edit-npcs').value),
                waypoints:  compactToDbFormat(document.getElementById('mp-edit-waypoints').value),
            };
            payload.data = `[${payload.type},${payload.planet_id},${payload.bg_type},${payload.tile_id},${payload.bg_id}]`;
            try {
                const res  = await fetch('/api/maps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (data.success) {
                    toast('Đã thêm bản đồ!', 'success');
                    mpCloseDrawer(); await mpLoad();
                } else { toast('Thêm thất bại: ' + (data.message || ''), 'error'); }
            } catch (e) { toast('Lỗi: ' + e.message, 'error'); }
            return;
        }
        _origSave();
    };

    /* ── Search & filter events ── */
    let _searchTimer = null;
    document.addEventListener('input', e => {
        if (e.target.id === 'mp-search') {
            clearTimeout(_searchTimer);
            _searchTimer = setTimeout(() => { _searchQ = e.target.value.trim(); applyFilter(); }, 200);
        }
    });
    document.addEventListener('change', e => {
        if (e.target.id === 'mp-filter-planet') { _filterPlanet = e.target.value; applyFilter(); }
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') mpCloseDrawer();
    });

    /* ── Intercept renderTable chung ── */
    const _origRender = window.renderTable;
    window.renderTable = function(key, rows, cols) {
        if (key === 'maps') return;
        return _origRender ? _origRender(key, rows, cols) : undefined;
    };

    /* ── Load khi tab được kích hoạt ── */
    document.addEventListener('dashboardActivated', () => {});
    if (document.getElementById('maps')?.classList.contains('active')) mpLoad();
    document.addEventListener('click', e => {
        if (e.target.closest('.menu-item')?.dataset?.target === 'maps' && !_all.length) mpLoad();
    });

})();
</script>
