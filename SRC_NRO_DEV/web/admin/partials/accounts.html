<link rel="stylesheet" href="/admin/css/accounts.css" />

<section class="module" id="accounts">

    <div class="mb-banner">
        <div class="mb-left">
            <div class="mb-avatar">👤</div>
            <div class="mb-info">
                <h2 class="mb-title">
                    Tài khoản
                    <span class="mb-badge" id="accounts-total-badge">Tổng: 0</span>
                </h2>
                <div class="mb-actions">
                    <button class="mb-btn mb-btn-primary" onclick="showTab('dashboard')">🏠 Go Panel</button>
                    <button class="mb-btn mb-btn-refresh" onclick="loadTableData('accounts')">🔄 Làm Mới</button>
                </div>
            </div>
        </div>
        <div class="mb-photos">
            <div class="mb-photo mb-photo-1"></div>
            <div class="mb-photo mb-photo-2"></div>
            <div class="mb-photo mb-photo-3"></div>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>🔢 ID</th>
                        <th>👤 Username</th>
                        <th>📧 Email</th>
                        <th>🛡️ Admin</th>
                        <th>✅ Active</th>
                        <th>🚫 Ban</th>
                        <th>⚙️ Hành động</th>
                    </tr>
                </thead>
                <tbody id="accounts-table"></tbody>
            </table>
        </div>
    </div>

</section>

<script>
(function () {
    // Cập nhật badge tổng sau khi render
    const _origRender = window.renderTable;
    window.renderTable = function (key, rows, columns) {
        if (key === 'accounts') {
            const badge = document.getElementById('accounts-total-badge');
            if (badge) badge.textContent = 'Tổng: ' + (rows ? rows.length : 0);
        }
        return _origRender(key, rows, columns);
    };
})();
</script>
